<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom Maniupulation</title>
  </head>
  <body>
    <h1 id="heading">Hello World</h1>
    <button id="btn">Click Me</button>

    <script>
      let heading = document.querySelector("#heading");
      console.log(heading);

      heading.innerHTML = "Hello Abhishek";

      let btn = document.querySelector("#btn");
      btn.addEventListener("click", function () {
        if ((heading.innerHTML === "Hello Abhishek")) {
          heading.innerHTML = "Hello Abhishek Kashyap";
        }
        else{
            heading.innerHTML = "Hello Abhishek";
        } 
          
        
      });
    </script>
  </body>
</html>
